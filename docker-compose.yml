# Base service definitions, shared between local dev and production.
# Local dev auto-loads docker-compose.override.yml alongside this (that's
# just how Compose works, no flag needed). Production explicitly adds
# docker-compose.prod.yml instead — see the README note in that file for
# the exact command.

services:
  api:
    build: .
    image: tfl-backend:latest
    command: ["node", "dist/index.js"]
    env_file: .env
    restart: unless-stopped

  poller:
    build: .
    image: tfl-backend:latest # same image as api, just a different command — Compose builds it once and reuses it
    command: ["node", "dist/services/pollingService.js"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      args:
        # Defaults to localhost for local dev. Production sets
        # NEXT_PUBLIC_API_URL in its own .env, which overrides this default
        # — no separate compose file needed just for this one value.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
    image: tfl-frontend:latest
    restart: unless-stopped
    depends_on:
      - api
